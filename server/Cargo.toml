[package]
name = "server"
edition = "2021"

[dependencies]
bytes = "1"
h3 = "0.0.7"
h3-quinn = "0.0.9"
h3-webtransport = "0.1.1"
h3-datagram = "0.0.1"
quinn = { version = "0.11.6", default-features = false, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
tokio = { version = "1.43.0", features = ["full"] }
rustls = { version = "0.23.21", default-features = false, features = [
    "ring",
    "std",
] }